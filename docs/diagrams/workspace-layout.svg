<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Berth 工作区布局图</title>
  <desc id="desc">展示桌面三栏工作区、顶部固定窗口控件、文件和会话标签栏、底部状态栏以及移动端 Sheet 布局。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".22"/></filter>
    <style>
      .title{font:700 34px system-ui,"Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:16px system-ui,"Noto Sans CJK SC",sans-serif;fill:#475569}
      .h{font:700 19px system-ui,"Noto Sans CJK SC",sans-serif;fill:#0f172a}.t{font:14px system-ui,"Noto Sans CJK SC",sans-serif;fill:#334155}.p{font:12px ui-monospace,SFMono-Regular,monospace;fill:#64748b}
      .frame{fill:#fff;stroke:#334155;stroke-width:2.5;filter:url(#shadow)}.bar{fill:#e2e8f0;stroke:#94a3b8}.sidebar{fill:#dbeafe;stroke:#60a5fa}.main{fill:#ecfeff;stroke:#22d3ee}.aux{fill:#f3e8ff;stroke:#c084fc}.status{fill:#1e293b;stroke:#0f172a}.handle{fill:#94a3b8}.note{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Berth 工作区布局</text>
  <text x="70" y="92" class="sub">依据 src/app/workspace/layout.tsx、AuxPanel、StatusBar 与当前未提交布局工作树</text>

  <text x="80" y="142" class="h">Desktop</text>
  <rect x="80" y="165" width="1120" height="720" rx="20" class="frame"/>
  <rect x="100" y="185" width="1080" height="52" rx="10" class="bar"/>
  <rect x="100" y="185" width="220" height="52" rx="10" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="210" y="216" text-anchor="middle" class="h">LeftEdgeChrome</text>
  <rect x="320" y="185" width="640" height="52" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="640" y="216" text-anchor="middle" class="h">FileWorkspaceTabBar</text>
  <rect x="960" y="185" width="220" height="52" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="1070" y="207" text-anchor="middle" class="h">RightEdgeChrome</text><text x="1070" y="225" text-anchor="middle" class="p">+ WindowControls</text>

  <rect x="100" y="250" width="245" height="555" rx="12" class="sidebar"/>
  <text x="222" y="290" text-anchor="middle" class="h">Sidebar</text>
  <text x="222" y="317" text-anchor="middle" class="t">项目 / 文件树 / 导航</text>
  <text x="222" y="345" text-anchor="middle" class="p">collapsible SplitPane</text>
  <rect x="350" y="250" width="7" height="555" class="handle"/>

  <rect x="362" y="250" width="515" height="555" rx="12" class="main"/>
  <text x="620" y="290" text-anchor="middle" class="h">Main File Workspace</text>
  <rect x="385" y="320" width="469" height="54" rx="9" fill="#cffafe" stroke="#67e8f9"/>
  <text x="619" y="353" text-anchor="middle" class="h">FileWorkspaceHeader</text>
  <rect x="385" y="390" width="469" height="340" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="619" y="500" text-anchor="middle" class="h">FileWorkspacePanel</text>
  <text x="619" y="529" text-anchor="middle" class="t">Text / Markdown / HTML / Canvas</text>
  <text x="619" y="553" text-anchor="middle" class="t">Image / Office / PDF / Transcript</text>
  <text x="619" y="590" text-anchor="middle" class="p">SettingsWorkspaceView 在同一 surface 替换显示</text>
  <rect x="385" y="746" width="469" height="38" rx="8" class="note"/>
  <text x="619" y="770" text-anchor="middle" class="t">CodeMirror / PDF / Office 保持稳定 surface identity</text>

  <rect x="882" y="250" width="7" height="555" class="handle"/>
  <rect x="894" y="250" width="286" height="555" rx="12" class="aux"/>
  <rect x="910" y="270" width="254" height="52" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="1037" y="302" text-anchor="middle" class="h">TabBar</text>
  <text x="1037" y="365" text-anchor="middle" class="h">AuxPanel</text>
  <text x="1037" y="394" text-anchor="middle" class="t">ConversationDetailPanel</text>
  <text x="1037" y="422" text-anchor="middle" class="p">workspace page children</text>
  <rect x="915" y="455" width="244" height="245" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="1037" y="555" text-anchor="middle" class="h">会话 / Terminal Tab</text>
  <text x="1037" y="584" text-anchor="middle" class="t">右侧可折叠工作区</text>

  <rect x="100" y="815" width="1080" height="50" rx="10" class="status"/>
  <text x="380" y="846" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Alerts · Context · Update · Tasks</text>
  <line x1="882" y1="815" x2="882" y2="865" stroke="#64748b" stroke-width="2"/>
  <text x="1025" y="846" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Usage / Agent Launch Shelf</text>

  <text x="1250" y="142" class="h">Mobile</text>
  <rect x="1250" y="165" width="270" height="620" rx="30" class="frame"/>
  <rect x="1268" y="188" width="234" height="48" rx="9" class="bar"/>
  <text x="1385" y="218" text-anchor="middle" class="h">FolderTitleBar</text>
  <rect x="1268" y="248" width="234" height="455" rx="12" class="main"/>
  <text x="1385" y="390" text-anchor="middle" class="h">单主 Surface</text>
  <text x="1385" y="421" text-anchor="middle" class="t">Conversation 或 File</text>
  <text x="1385" y="448" text-anchor="middle" class="p">activePane 切换</text>
  <rect x="1268" y="714" width="234" height="48" rx="9" class="status"/>
  <text x="1385" y="744" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Mobile StatusBar</text>
  <rect x="1225" y="300" width="42" height="260" rx="12" fill="#bfdbfe" stroke="#60a5fa" stroke-dasharray="7 6"/>
  <text x="1246" y="430" text-anchor="middle" class="t" transform="rotate(-90 1246 430)">Left Sheet → Sidebar</text>
  <rect x="1503" y="300" width="42" height="260" rx="12" fill="#ede9fe" stroke="#c084fc" stroke-dasharray="7 6"/>
  <text x="1524" y="430" text-anchor="middle" class="t" transform="rotate(90 1524 430)">Right Sheet → AuxPanel</text>

  <rect x="80" y="915" width="1440" height="56" rx="14" class="note"/>
  <text x="800" y="940" text-anchor="middle" class="h">布局原则</text>
  <text x="800" y="960" text-anchor="middle" class="t">一个 SplitView 引擎；拖动 preview 只写局部 CSS，commit 后才持久化和通知 Terminal / Native Surface</text>
</svg>
