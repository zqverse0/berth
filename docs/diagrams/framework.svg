<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Berth 框架结构图</title>
  <desc id="desc">展示 Next.js 前端、Tauri 命令层、Rust 领域、终端 SDK 与 daemon、存储和用户资产之间的依赖关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 34px system-ui,"Noto Sans CJK SC",sans-serif;fill:#f8fafc}.sub{font:16px system-ui,"Noto Sans CJK SC",sans-serif;fill:#94a3b8}
      .lane{fill:#172033;stroke:#334155;stroke-width:1.5}.box{stroke-width:2;filter:url(#shadow)}
      .h{font:700 20px system-ui,"Noto Sans CJK SC",sans-serif;fill:#f8fafc}.t{font:15px system-ui,"Noto Sans CJK SC",sans-serif;fill:#dbeafe}.p{font:11px ui-monospace,SFMono-Regular,monospace;fill:#94a3b8}
      .line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.label{font:11px system-ui,"Noto Sans CJK SC",sans-serif;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <text x="70" y="62" class="title">Berth 框架结构</text>
  <text x="70" y="92" class="sub">依据 package.json、src/app/workspace、src/lib/transport、src-tauri/src/lib.rs 与 terminal workspace</text>

  <rect x="55" y="125" width="1490" height="170" rx="24" class="lane"/>
  <text x="80" y="158" class="sub">入口与用户界面</text>
  <rect x="90" y="180" width="390" height="85" rx="16" fill="#1d4ed8" stroke="#60a5fa" class="box"/>
  <text x="285" y="214" text-anchor="middle" class="h">Next.js 静态 Renderer</text><text x="285" y="239" text-anchor="middle" class="p">src/app · components · stores · knowledge · sessions</text>
  <rect x="605" y="180" width="390" height="85" rx="16" fill="#6d28d9" stroke="#c4b5fd" class="box"/>
  <text x="800" y="214" text-anchor="middle" class="h">berth CLI</text><text x="800" y="239" text-anchor="middle" class="p">terminal/cli/berth-cli</text>
  <rect x="1120" y="180" width="390" height="85" rx="16" fill="#0f766e" stroke="#5eead4" class="box"/>
  <text x="1315" y="214" text-anchor="middle" class="h">用户维护资产</text><text x="1315" y="239" text-anchor="middle" class="p">$BERTH_HOME/tools · experts · prompts · skills · mcp</text>

  <rect x="55" y="325" width="1490" height="190" rx="24" class="lane"/>
  <text x="80" y="358" class="sub">边界适配层</text>
  <rect x="90" y="385" width="390" height="95" rx="16" fill="#1e3a8a" stroke="#93c5fd" class="box"/>
  <text x="285" y="418" text-anchor="middle" class="h">Frontend Transport</text><text x="285" y="443" text-anchor="middle" class="p">src/lib/transport → Tauri invoke / event</text>
  <rect x="605" y="385" width="390" height="95" rx="16" fill="#4c1d95" stroke="#ddd6fe" class="box"/>
  <text x="800" y="418" text-anchor="middle" class="h">CLI Adapters</text><text x="800" y="443" text-anchor="middle" class="p">Plugin check · terminal attach · GUI control client</text>
  <rect x="1120" y="385" width="390" height="95" rx="16" fill="#134e4a" stroke="#99f6e4" class="box"/>
  <text x="1315" y="418" text-anchor="middle" class="h">共享纯 Rust 契约</text><text x="1315" y="443" text-anchor="middle" class="p">berth-tool-core · berth-control-proto · term shared</text>

  <rect x="55" y="545" width="1490" height="230" rx="24" class="lane"/>
  <text x="80" y="578" class="sub">Tauri / Rust 领域层</text>
  <rect x="80" y="610" width="250" height="120" rx="16" fill="#155e75" stroke="#67e8f9" class="box"/><text x="205" y="644" text-anchor="middle" class="h">Tauri Commands</text><text x="205" y="670" text-anchor="middle" class="t">serde / State / 错误映射</text><text x="205" y="698" text-anchor="middle" class="p">src-tauri/src/commands</text>
  <rect x="365" y="610" width="250" height="120" rx="16" fill="#075985" stroke="#7dd3fc" class="box"/><text x="490" y="644" text-anchor="middle" class="h">项目与内容</text><text x="490" y="670" text-anchor="middle" class="t">folders · files · git · knowledge</text><text x="490" y="698" text-anchor="middle" class="p">db services / filesystem</text>
  <rect x="650" y="610" width="250" height="120" rx="16" fill="#7c2d12" stroke="#fdba74" class="box"/><text x="775" y="644" text-anchor="middle" class="h">Agent 资产与历史</text><text x="775" y="670" text-anchor="middle" class="t">tool · sessions · model_provider</text><text x="775" y="698" text-anchor="middle" class="p">declarative projection</text>
  <rect x="935" y="610" width="250" height="120" rx="16" fill="#713f12" stroke="#fde68a" class="box"/><text x="1060" y="644" text-anchor="middle" class="h">任务与工作流</text><text x="1060" y="670" text-anchor="middle" class="t">Trellis read · Automation</text><text x="1060" y="698" text-anchor="middle" class="p">runtime_bridge / scheduler</text>
  <rect x="1220" y="610" width="250" height="120" rx="16" fill="#3f3f46" stroke="#d4d4d8" class="box"/><text x="1345" y="644" text-anchor="middle" class="h">GUI Terminal Adapter</text><text x="1345" y="670" text-anchor="middle" class="t">manager · snapshot · stream</text><text x="1345" y="698" text-anchor="middle" class="p">src-tauri/src/terminal</text>

  <rect x="55" y="805" width="1490" height="220" rx="24" class="lane"/>
  <text x="80" y="838" class="sub">持久化与执行权威</text>
  <rect x="90" y="870" width="260" height="105" rx="16" fill="#334155" stroke="#94a3b8" class="box"/><text x="220" y="905" text-anchor="middle" class="h">SQLite + Keyring</text><text x="220" y="932" text-anchor="middle" class="p">$BERTH_DATA_DIR</text><text x="220" y="954" text-anchor="middle" class="t">业务事实 / 密钥</text>
  <rect x="430" y="870" width="260" height="105" rx="16" fill="#334155" stroke="#94a3b8" class="box"/><text x="560" y="905" text-anchor="middle" class="h">项目文件系统</text><text x="560" y="932" text-anchor="middle" class="p">project/.trellis · project/.berth</text><text x="560" y="954" text-anchor="middle" class="t">文件 / Task / Knowledge</text>
  <rect x="770" y="870" width="260" height="105" rx="16" fill="#166534" stroke="#86efac" class="box"/><text x="900" y="905" text-anchor="middle" class="h">berth-term-sdk</text><text x="900" y="932" text-anchor="middle" class="p">local IPC client</text><text x="900" y="954" text-anchor="middle" class="t">GUI / CLI 共用</text>
  <rect x="1110" y="870" width="400" height="105" rx="16" fill="#14532d" stroke="#bbf7d0" class="box"/><text x="1310" y="905" text-anchor="middle" class="h">berth-termd → Engine → PTY</text><text x="1310" y="932" text-anchor="middle" class="p">session / window / pane / process authority</text><text x="1310" y="954" text-anchor="middle" class="t">原生 Agent CLI 与 shell</text>

  <path d="M285 265 V385" class="line"/><path d="M800 265 V385" class="line"/><path d="M1315 265 V385" class="line"/>
  <path d="M285 480 V560 H205 V610" class="line"/><path d="M800 480 V560 H1345 V610" class="line"/><path d="M1315 480 V560 H775 V610" class="line"/>
  <path d="M330 670 H365" class="line"/><path d="M615 670 H650" class="line"/><path d="M900 670 H935" class="line"/><path d="M1185 670 H1220" class="line"/>
  <path d="M490 730 V820 H220 V870" class="line"/><path d="M775 730 V840 H560 V870" class="line"/><path d="M1060 730 V820 H900 V870" class="line"/><path d="M1345 730 V820 H900 V870" class="line"/>
  <path d="M1030 922 H1110" class="line"/>
</svg>
