[package]
name = "berth-term-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Berth's daemon-backed terminal SDK."
keywords = ["terminal", "multiplexer", "client"]
categories = ["command-line-interface", "asynchronous"]
publish = false

[dependencies]
berth-term-ipc = { path = "../../shared/berth-term-ipc" }
berth-term-os = { path = "../../shared/berth-term-os" }
berth-term-proto = { path = "../../shared/berth-term-proto" }
regex = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }
signal-hook = "0.3.18"
# Bootstrap actor needs Unix-specific async I/O plumbing (UnixStream + sleep),
# scoped to cfg(unix) so the SDK transport-actor manifest stays narrow on
# every other target.
tokio = { version = "1.48.0", features = ["net", "time"] }

[target.'cfg(windows)'.dependencies]
# Windows startup race serializes hidden-daemon launch behind a per-user named
# mutex. The SDK keeps `forbid(unsafe_code)`; FFI lives in `berth-term-ipc` and the
# windows-sys constants imported here are pure data values.
tokio = { version = "1.48.0", features = ["net", "signal", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
bincode = "1.3.3"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# Berth GUI / berth-cli 使用 default-features = false，默认不编译未用能力。
# crate 自身 default 打开 available，保证 tests/examples 仍能看到完整 SDK。
default = ["available"]
available = []
regex = ["dep:regex"]
web = []
