[package]
name = "berth-term-server"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Tokio daemon and request dispatcher for the Berth terminal runtime."
keywords = ["terminal", "multiplexer", "daemon"]
categories = ["command-line-interface"]

[dependencies]
async-recursion = "=1.1.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
regex = "1.12.2"
berth-control-proto = { path = "../../../control/berth-control-proto" }
berth-term-engine = { path = "../berth-term-engine" }
berth-term-ipc = { path = "../../shared/berth-term-ipc" }
berth-term-os = { path = "../../shared/berth-term-os" }
berth-term-proto = { path = "../../shared/berth-term-proto" }
berth-term-pty = { path = "../berth-term-pty" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"

[features]
default = []
perf-instrument = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
static_assertions = "1.1"
