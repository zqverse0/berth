[package]
name = "berth-term-engine"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Core session, pane, layout, format, hook, and buffer model for the Berth terminal runtime."
keywords = ["terminal", "multiplexer", "core"]
categories = ["command-line-interface"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
compact_str = "0.8.1"
regex = "1.12.2"
berth-term-proto = { path = "../../shared/berth-term-proto" }
unicode-width = "0.1"
